name: Laboratory quality
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  web-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check
